name: FBA alert (US)

on:
  schedule:
    - cron: "0 6 * * 1"   # понедельник 06:00 UTC = 09:00 Киев (летом)/08:00 (зимой)
  workflow_dispatch: {}

permissions:
  contents: write   # коммит файла состояния алертов

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run alert
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          HOPTED_SOURCE: bq
          SOURCES_SOURCE: bq
          INCOMING_SOURCE: bq
          REFERENCE_SOURCE: bq
          SHIPMENTS_SOURCE: sheet:128q44-RfvoJSLOHMHT-RaYwJMMJKleCvuQxI9uLgGfk
          BQ_PROJECT: reorder-497714
          USE_PLANNER_INCOMING: "false"
          PLAN_MODE: "off"
          BATCHES_CSV: ""
          AWD_LIVE_SOURCE: sheet:1acpHlfBiJjFm96VmFksRmKTnktULTgmu7iESYFDLUZw
          WAREHOUSE_LIVE_SOURCE: sheet:1acpHlfBiJjFm96VmFksRmKTnktULTgmu7iESYFDLUZw
          WAREHOUSE_EXCLUDE: DE
        run: python alert.py --always
      - name: Save alert state
        run: |
          git config user.name "fba-alert-bot"
          git config user.email "noreply@github.com"
          git add -f state/alert_state.json || true
          git diff --cached --quiet || (git commit -m "alert state" && git push)

name: Verify report

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESTOCK_REPORT_SHEET: ${{ vars.RESTOCK_REPORT_SHEET }}
        run: python verify_report.py
      - name: Save result
        run: |
          git config user.name "fba-alert-bot"
          git config user.email "noreply@github.com"
          git add -f state/verify_report.json || true
          git diff --cached --quiet || (git commit -m "verify report" && git pull --rebase -q && git push)

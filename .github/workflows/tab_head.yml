name: Tab head

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BQ_PROJECT: reorder-497714
          BOOK: 1XKUoiKUa8aF0DT7pNgXRqEvlejVu_FYVpMRPyGcOlLI
          TAB: Orders UK
        run: python tab_head.py
      - name: Save result
        run: |
          git config user.name "fba-alert-bot"
          git config user.email "noreply@github.com"
          git add -f state/tab_head.json || true
          git diff --cached --quiet || (git commit -m "tab head" && git pull --rebase -q && git push)

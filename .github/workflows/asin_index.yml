name: ASIN index

on:
  schedule:
    - cron: "50 6 * * 1-5"   # после отчёта по аутам (06:30 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build index
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESTOCK_REPORT_SHEET: ${{ vars.RESTOCK_REPORT_SHEET }}
        run: python asin_index.py
      - name: Save result
        if: always()
        run: |
          git config user.name "fba-alert-bot"
          git config user.email "noreply@github.com"
          git add -f state/asin_index.json || true
          git diff --cached --quiet || (git commit -m "asin index" && git pull --rebase -q && git push)

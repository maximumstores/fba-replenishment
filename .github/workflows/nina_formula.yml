name: Nina formula

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python nina_formula.py B0BDZND1XQ
      - name: Save result
        run: |
          git config user.name "fba-alert-bot"
          git config user.email "noreply@github.com"
          git add -f state/nina_formula.json || true
          git diff --cached --quiet || (git commit -m "nina formula" && git pull --rebase -q && git push)
